# 推送到 main 后自动构建并发布到 GitHub Pages
name: Deploy

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发（比如只想重新发布一次）
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消掉还在排队的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 要求 ^20.19.0 || >=22.12.0
          node-version: 22
          cache: npm

      - run: npm ci

      # 类型检查 + 单元测试 + fuzz。挂了就不发布，避免把坏版本推上线
      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
