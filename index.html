<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool Collection — 前端小工具集</title>
    <meta name="description" content="一组按需加载的前端小工具，处理全部在浏览器本地完成。" />
    <!-- 先于渲染应用主题，避免刷新闪白 -->
    <script>
      (function () {
        try {
          // 没存过 = 跟随系统；存过 = 用户已经选定
          var s = localStorage.getItem("tc-theme");
          var d =
            s === "dark" ||
            (s !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/landing/main.ts"></script>
  </body>
</html>
